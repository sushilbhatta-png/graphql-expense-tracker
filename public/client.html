<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker - GraphQL</title>
    <link rel="stylesheet" href="./assets/style.css">
    <script src="./assets/script.js" defer></script>
</head>
<body>
    <div class="layout">

        <!-- ===== Main column ===== -->
        <main class="main-col">

            <!-- New Expense Form -->
            <h1>Add New Expense</h1>
            <form id="expenseForm">
                <div>
                    <label for="title">Expense Title:</label>
                    <input type="text" id="title" required>
                </div>

                <br>

                <div>
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" step="0.01" min="0.01" required>
                </div>

                <br>

                <div>
                    <label for="category">Category:</label>
                    <select id="category" required>
                        <option value="FOOD">Food</option>
                        <option value="TRANSPORT">Transport</option>
                        <option value="SHOPPING">Shopping</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <br>

                <button type="submit">Add Expense</button>
            </form>

            <!-- Expense Update Form -->
            <h2>Update Expense (Testing)</h2>
            <form id="updateExpenseForm">
                <label for="updateId">Expense ID</label>
                <input type="number" id="updateId" required>

                <label for="updateTitle">New Title</label>
                <input type="text" id="updateTitle" required>

                <label for="updateAmount">New Amount</label>
                <input type="number" step="0.01" id="updateAmount" required>

                <label for="updateCategory">New Category</label>
                <select id="updateCategory" required>
                    <option value="FOOD">Food</option>
                    <option value="TRANSPORT">Transport</option>
                    <option value="SHOPPING">Shopping</option>
                    <option value="OTHER">Other</option>
                </select>

                <button type="submit">Update Expense</button>
            </form>

            <!-- All Expenses -->
            <div id="expenseListSection">
                <h2>All Expenses</h2>

                <div class="filter-bar">
                    <label for="categoryFilter">Filter by category:</label>
                    <select id="categoryFilter">
                        <option value="">All categories</option>
                        <option value="FOOD">Food</option>
                        <option value="TRANSPORT">Transport</option>
                        <option value="SHOPPING">Shopping</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div id="expenseList"></div>
            </div>
        </main>

        <!-- ===== Sidebar ===== -->
        <aside class="sidebar">
            <h2>Response</h2>
            <div id="result"></div>

            <h2>Update Response</h2>
            <div id="updateResult"></div>
        </aside>

    </div>
</body>
</html>
